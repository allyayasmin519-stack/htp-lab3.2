
# Workflow to demonstrate developing workflows in branches
name: Develop in a branch

on:
  pull_request:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lint Workflow Files
        uses: raven-actions/actionlint@v2

      - name: Output Context Metadata
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Workflow triggered in branch '${GITHUB_REF}'."
          echo "Workflow triggered by event '${EVENT_NAME}'."
          echo "Workflow triggered by actor '${ACTOR}'."

      - name: Print Pull Request Title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Demo PR title is:"
          printf '%s\n' "$PR_TITLE"
